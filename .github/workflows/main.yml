name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        sdk:
          - openwrt-25.12
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare package feed
        run: |
            mkdir -p feed/luci-app-kucat-config
            if [ -f "Makefile" ]; then
            echo "Makefile found in root, copying all files"
            cp -r * feed/luci-app-kucat-config/ 2>/dev/null || true
            # 如果Makefile在子目录
            elif [ -f "luci-app-kucat-config/Makefile" ]; then
            echo "Makefile found in luci-app-kucat-config subdirectory"
            cp -r luci-app-kucat-config/* feed/luci-app-kucat-config/
            else
            echo "ERROR: Cannot find Makefile"
            find . -name "Makefile"
            exit 1
            fi
            echo "Final feed structure:"
            ls -la feed/luci-app-kucat-config/
      
      - name: Build packages
        uses: sirpdboy/gh-action-sdk@go1.26
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-kucat-config
          FEED_DIR: ${{ github.workspace }}/feed
          NO_REFRESH_CHECK: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            bin/packages/x86_64/packages_ci/*.apk
            
      - name: Create release archive
        run: |
          tar -zcvf ${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz -C bin/packages/${{ matrix.arch }}/ packages_ci
          
      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly Build' }}
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ github.ref_type != 'tag' }} # 如果不是正式 Tag，自动标记为预发布版本
          artifacts: "${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz"
